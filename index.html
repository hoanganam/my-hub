<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quỹ Hưu Trí</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#059669">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hưu Trí">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div id="hdrSub" class="hdr-sub">Tự do tài chính</div>
      <h1 id="hdrTitle">Quỹ Hưu Trí</h1>
    </div>
    <button id="maskBtn" class="icon-btn" data-action="toggleMask" aria-label="Ẩn/hiện số tiền" title="Ẩn/hiện số tiền">
      <svg class="svg-ico" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <main id="main">
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-portfolio" class="tab"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-gemini" class="tab"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-action="goTab" data-tab="overview">
      <svg class="svg-ico" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
      <span>Tổng quan</span>
    </button>
    <button class="nav-item" data-action="goTab" data-tab="portfolio">
      <svg class="svg-ico" viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>
      <span>Tài sản</span>
    </button>
    <button class="nav-item" data-action="goTab" data-tab="plan">
      <svg class="svg-ico" viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
      <span>Tháng tới</span>
    </button>
    <button class="nav-item" data-action="goTab" data-tab="gemini">
      <svg class="svg-ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-1.9a2 2 0 0 0 1.3-1.3L12 3z"/></svg>
      <span>Gemini</span>
    </button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
