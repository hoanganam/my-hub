<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quỹ Hưu Trí</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1220">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Hưu Trí">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div id="hdrSub" class="hdr-sub">Quỹ hưu trí</div>
      <h1 id="hdrTitle">Tổng quan</h1>
    </div>
    <button id="maskBtn" class="icon-btn" data-action="toggleMask" aria-label="Ẩn/hiện số tiền" title="Ẩn/hiện số tiền">👁</button>
  </header>

  <main id="main">
    <section id="tab-overview" class="tab active"></section>
    <section id="tab-portfolio" class="tab"></section>
    <section id="tab-plan" class="tab"></section>
    <section id="tab-gemini" class="tab"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-action="goTab" data-tab="overview"><span class="ni">📊</span><span>Tổng quan</span></button>
    <button class="nav-item" data-action="goTab" data-tab="portfolio"><span class="ni">💼</span><span>Danh mục</span></button>
    <button class="nav-item" data-action="goTab" data-tab="plan"><span class="ni">🧮</span><span>Kế hoạch</span></button>
    <button class="nav-item" data-action="goTab" data-tab="gemini"><span class="ni">✨</span><span>Gemini</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
