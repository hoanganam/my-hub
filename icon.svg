    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <g transform="translate(256, 256) rotate(-35) translate(-256, -256)">
    <!-- Dumbbell bar -->
    <rect x="160" y="238" width="192" height="36" rx="12" fill="#94a3b8"/>
    <!-- Left plates -->
    <rect x="112" y="156" width="44" height="200" rx="18" fill="url(#accent)"/>
    <rect x="68" y="186" width="36" height="140" rx="14" fill="#10b981" opacity="0.85"/>
    <!-- Right plates -->
    <rect x="356" y="156" width="44" height="200" rx="18" fill="url(#accent)"/>
    <rect x="408" y="186" width="36" height="140" rx="14" fill="#06b6d4" opacity="0.85"/>
  </g>
</svg>

